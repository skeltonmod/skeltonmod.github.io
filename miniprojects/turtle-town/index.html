<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TROUBLE IN TURTLE TOWN</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #212123;
      }
      html,
      body {

        background: var(--bg);
